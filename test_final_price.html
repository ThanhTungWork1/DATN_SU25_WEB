<!DOCTYPE html>
<html>
<head>
    <title>Test Final Price</title>
</head>
<body>
    <h1>Test Giá Cuối Cùng</h1>
    
    <h2>Mô phỏng giỏ hàng</h2>
    <div>
        <h3>Sản phẩm: Áo thun nam</h3>
        <p>Giá gốc từ API: <span id="originalPrice">94</span></p>
        <p>Giá hiển thị: <span id="displayPrice">94,000 VND</span></p>
        <p>Số lượng: <input type="number" id="quantity" value="3" min="1"></p>
        <p>Tổng tiền: <span id="totalPrice">282,000 VND</span></p>
    </div>

    <h2>Kiểm tra tính toán</h2>
    <div id="calculation"></div>

    <script>
        const originalPrice = 94; // Giá từ API
        const displayPrice = originalPrice * 1000; // Giá hiển thị
        const quantityInput = document.getElementById('quantity');
        const totalPriceSpan = document.getElementById('totalPrice');
        const calculationDiv = document.getElementById('calculation');

        document.getElementById('originalPrice').textContent = originalPrice;
        document.getElementById('displayPrice').textContent = displayPrice.toLocaleString('vi-VN') + ' VND';

        function updateCalculation() {
            const quantity = parseInt(quantityInput.value) || 1;
            const total = displayPrice * quantity;
            
            totalPriceSpan.textContent = total.toLocaleString('vi-VN') + ' VND';
            
            calculationDiv.innerHTML = `
                <h3>Chi tiết tính toán:</h3>
                <p>Giá gốc từ API: ${originalPrice}</p>
                <p>Giá hiển thị: ${originalPrice} × 1000 = ${displayPrice.toLocaleString('vi-VN')} VND</p>
                <p>Số lượng: ${quantity}</p>
                <p>Tổng tiền: ${displayPrice.toLocaleString('vi-VN')} × ${quantity} = ${total.toLocaleString('vi-VN')} VND</p>
                <p style="color: green;">✅ Giá hiển thị đúng: 94,000 VND</p>
                <p style="color: green;">✅ Tổng tiền đúng: ${total.toLocaleString('vi-VN')} VND</p>
            `;
        }

        quantityInput.addEventListener('input', updateCalculation);
        updateCalculation();
    </script>
</body>
</html>
