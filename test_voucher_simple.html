<!DOCTYPE html>
<html>
<head>
    <title>Test Voucher Simple</title>
    <style>
        body { font-family: Arial; margin: 20px; }
        .success { color: green; background: #d4edda; padding: 10px; margin: 10px 0; }
        .error { color: red; background: #f8d7da; padding: 10px; margin: 10px 0; }
        .info { background: #d1ecf1; padding: 10px; margin: 10px 0; }
    </style>
</head>
<body>
    <h1>🧪 Test Voucher API - Simple</h1>
    
    <div class="info">
        <h3>📋 Vouchers có sẵn:</h3>
        <ul>
            <li><strong>SAVE10</strong> - Giảm 10% (tối đa 50,000 VND)</li>
            <li><strong>SAVE20</strong> - Giảm 20% (tối đa 100,000 VND)</li>
            <li><strong>FIXED30K</strong> - Giảm cố định 30,000 VND</li>
            <li><strong>MUA HE 2025</strong> - Giảm 10% (tối đa 50,000 VND)</li>
        </ul>
    </div>

    <h2>🔍 Test Validate Voucher</h2>
    <div>
        <label>Mã Voucher:</label><br>
        <input type="text" id="voucherCode" value="SAVE10" style="width: 200px; padding: 5px;"><br><br>
        
        <label>Tổng tiền đơn hàng (VND):</label><br>
        <input type="number" id="totalAmount" value="200000" style="width: 200px; padding: 5px;"><br><br>
        
        <button onclick="testVoucher()" style="padding: 10px 20px; background: #007bff; color: white; border: none; cursor: pointer;">
            Test Voucher
        </button>
    </div>
    
    <div id="result"></div>

    <h2>📊 Quick Tests</h2>
    <button onclick="runQuickTests()" style="padding: 10px 20px; background: #28a745; color: white; border: none; cursor: pointer;">
        Chạy Quick Tests
    </button>
    <div id="quickResults"></div>

    <script>
        async function testVoucher() {
            const code = document.getElementById('voucherCode').value;
            const totalAmount = parseFloat(document.getElementById('totalAmount').value);
            const resultDiv = document.getElementById('result');

            if (!code || !totalAmount) {
                resultDiv.innerHTML = '<div class="error">❌ Vui lòng nhập đầy đủ thông tin!</div>';
                return;
            }

            try {
                console.log('🧪 Testing voucher:', code, 'with amount:', totalAmount);
                
                const response = await fetch('http://localhost:8000/api/test-voucher', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        code: code,
                        total_amount: totalAmount
                    })
                });

                const data = await response.json();
                console.log('📡 API Response:', data);
                
                if (data.status === 'success') {
                    resultDiv.innerHTML = `
                        <div class="success">
                            <h3>✅ Voucher hợp lệ!</h3>
                            <p><strong>Mã voucher:</strong> ${data.data.voucher.code}</p>
                            <p><strong>Tên voucher:</strong> ${data.data.voucher.title}</p>
                            <p><strong>Giảm giá:</strong> ${data.data.discount_amount.toLocaleString()} VND</p>
                            <p><strong>Tổng tiền gốc:</strong> ${totalAmount.toLocaleString()} VND</p>
                            <p><strong>Tổng tiền sau giảm:</strong> ${data.data.final_amount.toLocaleString()} VND</p>
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <div class="error">
                            <h3>❌ Voucher không hợp lệ!</h3>
                            <p><strong>Lỗi:</strong> ${data.message}</p>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('❌ Error:', error);
                resultDiv.innerHTML = `
                    <div class="error">
                        <h3>❌ Lỗi kết nối!</h3>
                        <p><strong>Lỗi:</strong> ${error.message}</p>
                        <p>Hãy đảm bảo backend Laravel đang chạy ở localhost:8000</p>
                    </div>
                `;
            }
        }

        async function runQuickTests() {
            const tests = [
                { code: 'SAVE10', amount: 200000, desc: 'SAVE10 với 200k' },
                { code: 'SAVE20', amount: 300000, desc: 'SAVE20 với 300k' },
                { code: 'FIXED30K', amount: 200000, desc: 'FIXED30K với 200k' },
                { code: 'INVALID', amount: 200000, desc: 'Voucher không tồn tại' },
                { code: 'MUA HE 2025', amount: 150000, desc: 'MUA HE 2025 với 150k' }
            ];

            const resultsDiv = document.getElementById('quickResults');
            resultsDiv.innerHTML = '<h3>🧪 Đang chạy quick tests...</h3>';

            let results = [];

            for (let test of tests) {
                try {
                    const response = await fetch('http://localhost:8000/api/test-voucher', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            code: test.code,
                            total_amount: test.amount
                        })
                    });

                    const data = await response.json();
                    const success = data.status === 'success';
                    
                    results.push({
                        desc: test.desc,
                        success: success,
                        message: data.message || 'N/A',
                        discount: success ? data.data.discount_amount : 0,
                        final: success ? data.data.final_amount : test.amount
                    });
                } catch (error) {
                    results.push({
                        desc: test.desc,
                        success: false,
                        message: error.message,
                        discount: 0,
                        final: test.amount
                    });
                }
            }

            // Hiển thị kết quả
            let html = '<h3>📊 Kết quả Quick Tests:</h3>';
            let passedCount = 0;

            results.forEach(result => {
                const statusClass = result.success ? 'success' : 'error';
                const statusIcon = result.success ? '✅' : '❌';
                
                html += `
                    <div class="${statusClass}">
                        <h4>${statusIcon} ${result.desc}</h4>
                        <p><strong>Kết quả:</strong> ${result.message}</p>
                        ${result.success ? `
                            <p><strong>Giảm giá:</strong> ${result.discount.toLocaleString()} VND</p>
                            <p><strong>Tổng tiền sau giảm:</strong> ${result.final.toLocaleString()} VND</p>
                        ` : ''}
                    </div>
                `;

                if (result.success) passedCount++;
            });

            html += `<h3>📈 Tổng kết: ${passedCount}/${results.length} tests passed</h3>`;
            resultsDiv.innerHTML = html;
        }

        // Auto-test khi load trang
        window.onload = function() {
            console.log('🧪 Voucher API Test Page loaded');
            console.log('📋 Available vouchers: SAVE10, SAVE20, FIXED30K, MUA HE 2025');
        };
    </script>
</body>
</html>
