<!DOCTYPE html>
<html>
<head>
    <title>Test Complete Checkout Flow</title>
</head>
<body>
    <h1>Test Toàn Bộ Flow Checkout</h1>
    
    <h2>1. Kiểm tra dữ liệu user</h2>
    <button onclick="checkUser()">Kiểm tra user</button>
    <div id="userResult"></div>
    
    <h2>2. Kiểm tra dữ liệu giỏ hàng</h2>
    <button onclick="checkCart()">Kiểm tra giỏ hàng</button>
    <div id="cartResult"></div>
    
    <h2>3. Test API Order</h2>
    <button onclick="testOrder()">Test đặt hàng</button>
    <div id="orderResult"></div>
    
    <h2>4. Test API Voucher</h2>
    <input type="text" id="voucherCode" placeholder="Nhập mã voucher" value="SAVE10">
    <button onclick="testVoucher()">Test voucher</button>
    <div id="voucherResult"></div>

    <script>
        async function checkUser() {
            const resultDiv = document.getElementById('userResult');
            resultDiv.innerHTML = '<p>Đang kiểm tra...</p>';
            
            try {
                const user = JSON.parse(localStorage.getItem('user') || '{}');
                const token = localStorage.getItem('token');
                
                resultDiv.innerHTML = `
                    <h3>Dữ liệu User:</h3>
                    <pre>${JSON.stringify(user, null, 2)}</pre>
                    <p><strong>Token:</strong> ${token ? 'Có' : 'Không có'}</p>
                    <p><strong>User ID:</strong> ${user.id || user.user_id || 'Không có'}</p>
                    <p><strong>Vấn đề:</strong> ${!user.id && !user.user_id ? '❌ Chưa đăng nhập' : '✅ Đã đăng nhập'}</p>
                `;
            } catch (error) {
                resultDiv.innerHTML = `<p style="color: red;">Lỗi: ${error.message}</p>`;
            }
        }
        
        async function checkCart() {
            const resultDiv = document.getElementById('cartResult');
            resultDiv.innerHTML = '<p>Đang kiểm tra...</p>';
            
            try {
                const token = localStorage.getItem('token');
                if (!token) {
                    resultDiv.innerHTML = '<p style="color: red;">Chưa đăng nhập!</p>';
                    return;
                }

                const response = await fetch('http://localhost:8000/api/cart', {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                const data = await response.json();
                
                let html = '<h3>Dữ liệu giỏ hàng:</h3>';
                html += '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
                
                if (data.cart_items && data.cart_items.length > 0) {
                    html += '<h3>Phân tích giá:</h3>';
                    data.cart_items.forEach((item, index) => {
                        const unitPrice = item.price;
                        const quantity = item.quantity;
                        const displayPrice = unitPrice * 1000;
                        const total = displayPrice * quantity;
                        
                        html += `
                            <div style="border: 1px solid #ccc; padding: 10px; margin: 10px 0;">
                                <h4>Sản phẩm ${index + 1}: ${item.name}</h4>
                                <p><strong>Giá gốc từ API:</strong> ${unitPrice}</p>
                                <p><strong>Giá hiển thị:</strong> ${displayPrice.toLocaleString('vi-VN')} VND</p>
                                <p><strong>Số lượng:</strong> ${quantity}</p>
                                <p><strong>Tổng tiền:</strong> ${total.toLocaleString('vi-VN')} VND</p>
                                <p><strong>Vấn đề:</strong> ${unitPrice < 1000 ? '❌ Giá quá thấp' : '✅ Giá ổn'}</p>
                            </div>
                        `;
                    });
                }

                resultDiv.innerHTML = html;
                
            } catch (error) {
                resultDiv.innerHTML = `<p style="color: red;">Lỗi: ${error.message}</p>`;
            }
        }
        
        async function testOrder() {
            const resultDiv = document.getElementById('orderResult');
            resultDiv.innerHTML = '<p>Đang test...</p>';
            
            try {
                const user = JSON.parse(localStorage.getItem('user') || '{}');
                const userId = user.id || user.user_id || 1;
                
                const orderData = {
                    userId: userId,
                    items: [
                        {
                            id: 1,
                            name: "Áo thun nam",
                            quantity: 1,
                            price: 94
                        }
                    ],
                    totalAmount: 94000,
                    address: {
                        province: "Hà Nội",
                        district: "Ba Đình",
                        ward: "Trúc Bạch",
                        street: "90"
                    },
                    paymentMethod: "COD",
                    status: "Chờ xử lý",
                    createdAt: new Date().toISOString()
                };
                
                const response = await fetch('http://localhost:8000/api/test-order', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(orderData)
                });
                
                const data = await response.json();
                
                resultDiv.innerHTML = `
                    <h3>Kết quả test order:</h3>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                    <p><strong>Status:</strong> ${data.success ? '✅ Thành công' : '❌ Thất bại'}</p>
                `;
                
            } catch (error) {
                resultDiv.innerHTML = `<p style="color: red;">Lỗi: ${error.message}</p>`;
            }
        }
        
        async function testVoucher() {
            const resultDiv = document.getElementById('voucherResult');
            resultDiv.innerHTML = '<p>Đang test...</p>';
            
            try {
                const code = document.getElementById('voucherCode').value;
                const totalAmount = 94000;
                
                const response = await fetch('http://localhost:8000/api/test-voucher', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        code: code,
                        total_amount: totalAmount
                    })
                });
                
                const data = await response.json();
                
                resultDiv.innerHTML = `
                    <h3>Kết quả test voucher:</h3>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                    <p><strong>Status:</strong> ${data.success || data.status === 'success' ? '✅ Thành công' : '❌ Thất bại'}</p>
                `;
                
            } catch (error) {
                resultDiv.innerHTML = `<p style="color: red;">Lỗi: ${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
