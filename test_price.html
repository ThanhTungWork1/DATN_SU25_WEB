<!DOCTYPE html>
<html>
<head>
    <title>Test Price Display</title>
</head>
<body>
    <h1>Test Price Display</h1>
    
    <h2>Test Product Price</h2>
    <div>
        <p>Giá sản phẩm: <span id="productPrice">99.000đ</span></p>
        <p>Số lượng: <input type="number" id="quantity" value="2" min="1"></p>
        <p>Tổng tiền: <span id="totalPrice">188.000 VND</span></p>
    </div>

    <h2>Test Cart Price</h2>
    <div>
        <p>Giá trong giỏ hàng: <span id="cartPrice">94.000 VND</span></p>
        <p>Số lượng: <span id="cartQuantity">2</span></p>
        <p>Tổng tiền: <span id="cartTotal">188.000 VND</span></p>
    </div>

    <script>
        // Test giá sản phẩm
        const productPrice = 99000; // 99.000đ
        const quantity = 2;
        const totalPrice = productPrice * quantity;
        
        document.getElementById('productPrice').textContent = productPrice.toLocaleString('vi-VN') + 'đ';
        document.getElementById('totalPrice').textContent = totalPrice.toLocaleString('vi-VN') + ' VND';
        
        // Test giá giỏ hàng
        const cartPrice = 94000; // 94.000 VND
        const cartQuantity = 2;
        const cartTotal = cartPrice * cartQuantity;
        
        document.getElementById('cartPrice').textContent = cartPrice.toLocaleString('vi-VN') + ' VND';
        document.getElementById('cartTotal').textContent = cartTotal.toLocaleString('vi-VN') + ' VND';
        
        // Cập nhật khi thay đổi số lượng
        document.getElementById('quantity').addEventListener('input', function() {
            const newQuantity = parseInt(this.value) || 1;
            const newTotal = productPrice * newQuantity;
            document.getElementById('totalPrice').textContent = newTotal.toLocaleString('vi-VN') + ' VND';
        });
    </script>
</body>
</html>
