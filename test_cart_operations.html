<!DOCTYPE html>
<html>
<head>
    <title>Test Cart Operations</title>
    <style>
        body { font-family: Arial; margin: 20px; }
        .success { color: green; background: #d4edda; padding: 10px; margin: 10px 0; }
        .error { color: red; background: #f8d7da; padding: 10px; margin: 10px 0; }
        .info { background: #d1ecf1; padding: 10px; margin: 10px 0; }
        .warning { color: orange; background: #fff3cd; padding: 10px; margin: 10px 0; }
    </style>
</head>
<body>
    <h1>🧪 Test Cart Operations</h1>
    
    <div class="info">
        <h3>📋 Hướng dẫn test:</h3>
        <ol>
            <li>Đảm bảo backend Laravel đang chạy ở localhost:8000</li>
            <li>Đăng nhập và thêm sản phẩm vào giỏ hàng</li>
            <li>Sử dụng các nút test bên dưới</li>
        </ol>
    </div>

    <h2>🔍 Test Cart Operations</h2>
    <div>
        <button onclick="testGetCart()" style="padding: 10px 20px; background: #007bff; color: white; border: none; cursor: pointer;">
            Get Cart
        </button>
        <button onclick="testAddToCart()" style="padding: 10px 20px; background: #28a745; color: white; border: none; cursor: pointer;">
            Add Test Item
        </button>
        <button onclick="testUpdateQuantity()" style="padding: 10px 20px; background: #ffc107; color: black; border: none; cursor: pointer;">
            Update Quantity
        </button>
        <button onclick="testRemoveItem()" style="padding: 10px 20px; background: #dc3545; color: white; border: none; cursor: pointer;">
            Remove Item
        </button>
        <button onclick="testClearCart()" style="padding: 10px 20px; background: #6c757d; color: white; border: none; cursor: pointer;">
            Clear Cart
        </button>
    </div>
    
    <div id="result"></div>

    <h2>📊 Cart Items</h2>
    <div id="cartItems"></div>

    <script>
        let currentCartItems = [];

        async function testGetCart() {
            const resultDiv = document.getElementById('result');
            
            try {
                const token = localStorage.getItem('user_token') || localStorage.getItem('token');
                if (!token) {
                    resultDiv.innerHTML = '<div class="error">❌ Chưa đăng nhập!</div>';
                    return;
                }
                
                const response = await fetch('http://localhost:8000/api/cart', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                const data = await response.json();
                
                if (response.ok) {
                    currentCartItems = data.cart_items || [];
                    resultDiv.innerHTML = `
                        <div class="success">
                            <h3>✅ Lấy giỏ hàng thành công!</h3>
                            <p><strong>Số lượng sản phẩm:</strong> ${currentCartItems.length}</p>
                        </div>
                    `;
                    displayCartItems();
                } else {
                    resultDiv.innerHTML = `
                        <div class="error">
                            <h3>❌ Lỗi lấy giỏ hàng!</h3>
                            <p><strong>Lỗi:</strong> ${data.message}</p>
                        </div>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="error">
                        <h3>❌ Lỗi kết nối!</h3>
                        <p><strong>Lỗi:</strong> ${error.message}</p>
                    </div>
                `;
            }
        }

        function displayCartItems() {
            const cartDiv = document.getElementById('cartItems');
            if (currentCartItems.length === 0) {
                cartDiv.innerHTML = '<div class="warning">⚠️ Giỏ hàng trống</div>';
                return;
            }

            let html = '<div class="info"><h3>📦 Sản phẩm trong giỏ hàng:</h3>';
            currentCartItems.forEach((item, index) => {
                html += `
                    <div style="border: 1px solid #ccc; padding: 10px; margin: 5px 0;">
                        <p><strong>Index:</strong> ${index}</p>
                        <p><strong>Cart Item ID:</strong> ${item.id}</p>
                        <p><strong>Product ID:</strong> ${item.product_id}</p>
                        <p><strong>Tên:</strong> ${item.name}</p>
                        <p><strong>Số lượng:</strong> ${item.quantity}</p>
                        <p><strong>Giá:</strong> ${item.price.toLocaleString()} VND</p>
                        <button onclick="testRemoveSpecificItem(${item.id})" style="padding: 5px 10px; background: #dc3545; color: white; border: none; cursor: pointer;">
                            Remove This Item
                        </button>
                        <button onclick="testUpdateSpecificItem(${item.id})" style="padding: 5px 10px; background: #ffc107; color: black; border: none; cursor: pointer;">
                            Update Quantity
                        </button>
                    </div>
                `;
            });
            html += '</div>';
            cartDiv.innerHTML = html;
        }

        async function testAddToCart() {
            const resultDiv = document.getElementById('result');
            
            try {
                const token = localStorage.getItem('user_token') || localStorage.getItem('token');
                if (!token) {
                    resultDiv.innerHTML = '<div class="error">❌ Chưa đăng nhập!</div>';
                    return;
                }
                
                const testItem = {
                    cartItems: [
                        {
                            product_id: 1,
                            quantity: 2,
                            price: 150000
                        }
                    ]
                };
                
                const response = await fetch('http://localhost:8000/api/cart', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(testItem)
                });

                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.innerHTML = `
                        <div class="success">
                            <h3>✅ Thêm sản phẩm thành công!</h3>
                            <p><strong>Message:</strong> ${data.message}</p>
                        </div>
                    `;
                    // Refresh cart items
                    setTimeout(testGetCart, 1000);
                } else {
                    resultDiv.innerHTML = `
                        <div class="error">
                            <h3>❌ Lỗi thêm sản phẩm!</h3>
                            <p><strong>Lỗi:</strong> ${data.message}</p>
                        </div>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="error">
                        <h3>❌ Lỗi kết nối!</h3>
                        <p><strong>Lỗi:</strong> ${error.message}</p>
                    </div>
                `;
            }
        }

        async function testUpdateQuantity() {
            const resultDiv = document.getElementById('result');
            
            if (currentCartItems.length === 0) {
                resultDiv.innerHTML = '<div class="warning">⚠️ Không có sản phẩm nào để cập nhật</div>';
                return;
            }

            const item = currentCartItems[0];
            const newQuantity = item.quantity + 1;
            
            try {
                const token = localStorage.getItem('user_token') || localStorage.getItem('token');
                if (!token) {
                    resultDiv.innerHTML = '<div class="error">❌ Chưa đăng nhập!</div>';
                    return;
                }
                
                const response = await fetch(`http://localhost:8000/api/cart/${item.id}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        quantity: newQuantity
                    })
                });

                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.innerHTML = `
                        <div class="success">
                            <h3>✅ Cập nhật số lượng thành công!</h3>
                            <p><strong>Message:</strong> ${data.message}</p>
                            <p><strong>Item ID:</strong> ${item.id}</p>
                            <p><strong>New Quantity:</strong> ${newQuantity}</p>
                        </div>
                    `;
                    // Refresh cart items
                    setTimeout(testGetCart, 1000);
                } else {
                    resultDiv.innerHTML = `
                        <div class="error">
                            <h3>❌ Lỗi cập nhật số lượng!</h3>
                            <p><strong>Lỗi:</strong> ${data.message}</p>
                        </div>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="error">
                        <h3>❌ Lỗi kết nối!</h3>
                        <p><strong>Lỗi:</strong> ${error.message}</p>
                    </div>
                `;
            }
        }

        async function testRemoveItem() {
            const resultDiv = document.getElementById('result');
            
            if (currentCartItems.length === 0) {
                resultDiv.innerHTML = '<div class="warning">⚠️ Không có sản phẩm nào để xóa</div>';
                return;
            }

            const item = currentCartItems[0];
            
            try {
                const token = localStorage.getItem('user_token') || localStorage.getItem('token');
                if (!token) {
                    resultDiv.innerHTML = '<div class="error">❌ Chưa đăng nhập!</div>';
                    return;
                }
                
                const response = await fetch(`http://localhost:8000/api/cart/${item.id}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.innerHTML = `
                        <div class="success">
                            <h3>✅ Xóa sản phẩm thành công!</h3>
                            <p><strong>Message:</strong> ${data.message}</p>
                            <p><strong>Removed Item ID:</strong> ${item.id}</p>
                        </div>
                    `;
                    // Refresh cart items
                    setTimeout(testGetCart, 1000);
                } else {
                    resultDiv.innerHTML = `
                        <div class="error">
                            <h3>❌ Lỗi xóa sản phẩm!</h3>
                            <p><strong>Lỗi:</strong> ${data.message}</p>
                        </div>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="error">
                        <h3>❌ Lỗi kết nối!</h3>
                        <p><strong>Lỗi:</strong> ${error.message}</p>
                    </div>
                `;
            }
        }

        async function testRemoveSpecificItem(itemId) {
            const resultDiv = document.getElementById('result');
            
            try {
                const token = localStorage.getItem('user_token') || localStorage.getItem('token');
                if (!token) {
                    resultDiv.innerHTML = '<div class="error">❌ Chưa đăng nhập!</div>';
                    return;
                }
                
                const response = await fetch(`http://localhost:8000/api/cart/${itemId}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.innerHTML = `
                        <div class="success">
                            <h3>✅ Xóa sản phẩm thành công!</h3>
                            <p><strong>Message:</strong> ${data.message}</p>
                            <p><strong>Removed Item ID:</strong> ${itemId}</p>
                        </div>
                    `;
                    // Refresh cart items
                    setTimeout(testGetCart, 1000);
                } else {
                    resultDiv.innerHTML = `
                        <div class="error">
                            <h3>❌ Lỗi xóa sản phẩm!</h3>
                            <p><strong>Lỗi:</strong> ${data.message}</p>
                        </div>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="error">
                        <h3>❌ Lỗi kết nối!</h3>
                        <p><strong>Lỗi:</strong> ${error.message}</p>
                    </div>
                `;
            }
        }

        async function testUpdateSpecificItem(itemId) {
            const resultDiv = document.getElementById('result');
            
            try {
                const token = localStorage.getItem('user_token') || localStorage.getItem('token');
                if (!token) {
                    resultDiv.innerHTML = '<div class="error">❌ Chưa đăng nhập!</div>';
                    return;
                }
                
                const newQuantity = Math.floor(Math.random() * 5) + 1; // Random quantity 1-5
                
                const response = await fetch(`http://localhost:8000/api/cart/${itemId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        quantity: newQuantity
                    })
                });

                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.innerHTML = `
                        <div class="success">
                            <h3>✅ Cập nhật số lượng thành công!</h3>
                            <p><strong>Message:</strong> ${data.message}</p>
                            <p><strong>Item ID:</strong> ${itemId}</p>
                            <p><strong>New Quantity:</strong> ${newQuantity}</p>
                        </div>
                    `;
                    // Refresh cart items
                    setTimeout(testGetCart, 1000);
                } else {
                    resultDiv.innerHTML = `
                        <div class="error">
                            <h3>❌ Lỗi cập nhật số lượng!</h3>
                            <p><strong>Lỗi:</strong> ${data.message}</p>
                        </div>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="error">
                        <h3>❌ Lỗi kết nối!</h3>
                        <p><strong>Lỗi:</strong> ${error.message}</p>
                    </div>
                `;
            }
        }

        async function testClearCart() {
            const resultDiv = document.getElementById('result');
            
            try {
                const token = localStorage.getItem('user_token') || localStorage.getItem('token');
                if (!token) {
                    resultDiv.innerHTML = '<div class="error">❌ Chưa đăng nhập!</div>';
                    return;
                }
                
                const response = await fetch('http://localhost:8000/api/cart-clear', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    }
                });

                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.innerHTML = `
                        <div class="success">
                            <h3>✅ Xóa toàn bộ giỏ hàng thành công!</h3>
                            <p><strong>Message:</strong> ${data.message}</p>
                        </div>
                    `;
                    // Refresh cart items
                    setTimeout(testGetCart, 1000);
                } else {
                    resultDiv.innerHTML = `
                        <div class="error">
                            <h3>❌ Lỗi xóa giỏ hàng!</h3>
                            <p><strong>Lỗi:</strong> ${data.message}</p>
                        </div>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="error">
                        <h3>❌ Lỗi kết nối!</h3>
                        <p><strong>Lỗi:</strong> ${error.message}</p>
                    </div>
                `;
            }
        }

        // Auto-test khi load trang
        window.onload = function() {
            console.log('🧪 Cart Operations Test Page loaded');
            testGetCart(); // Auto load cart items
        };
    </script>
</body>
</html>
