<!DOCTYPE html>
<html>
<head>
    <title>Check User Login</title>
</head>
<body>
    <h1>Kiểm tra User Login</h1>
    <button onclick="checkUser()">Kiểm tra User</button>
    <button onclick="clearUser()">Xóa User</button>
    <div id="result"></div>

    <script>
        function checkUser() {
            const userStr = localStorage.getItem("user");
            const token = localStorage.getItem("token");
            
            let user = {};
            try {
                user = JSON.parse(userStr || "{}");
            } catch (error) {
                console.error("Error parsing user:", error);
            }
            
            const result = {
                userString: userStr,
                parsedUser: user,
                hasId: !!user.id,
                hasUserId: !!user.user_id,
                token: token,
                userId: user.id || user.user_id
            };
            
            document.getElementById('result').innerHTML = '<pre>' + JSON.stringify(result, null, 2) + '</pre>';
        }
        
        function clearUser() {
            localStorage.removeItem("user");
            localStorage.removeItem("token");
            alert("Đã xóa user!");
        }
    </script>
</body>
</html>
